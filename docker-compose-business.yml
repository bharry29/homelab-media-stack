# =============================================================================
# BUSINESS STACK - Business & Productivity Services
# =============================================================================
#
# This stack handles business and productivity tools:
# • Workflow automation (n8n)
# • Recipe management (Mealie)
# • Automatic updates handled by infrastructure watchtower
#
# Network: 172.42.0.0/24 (isolated from other stacks)
# Data: Shared /data volume with other stacks
# Environment: Configure via .env-business file
#
# Deploy: docker-compose --env-file .env-business -f docker-compose-business.yml up -d
# =============================================================================

version: '3.8'

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  business-network:
    name: business-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.42.0.0/24
          gateway: 172.42.0.1

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # WORKFLOW AUTOMATION
  # ---------------------------------------------------------------------------
  # PostgreSQL database for n8n workflow automation
  n8n-postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    hostname: n8n-postgres
    restart: unless-stopped
    
    # Direct network access
    networks:
      business-network:
        ipv4_address: 172.42.0.2
    
    # Database configuration
    environment:
      - POSTGRES_DB=${N8N_DB_NAME:-n8n}
      - POSTGRES_USER=${N8N_DB_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD:-n8n}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    # Persistent storage for database
    volumes:
      - ${BUSINESS_CONFIG_PATH}/n8n-postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    
    # Fix permissions for PostgreSQL
    user: "999:999"
    
    # No health check - let PostgreSQL start naturally
    
    # Update management
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # n8n - Workflow automation for business processes and productivity
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    
    # Direct network access
    networks:
      business-network:
        ipv4_address: 172.42.0.3
    
    # External access to web interface
    ports:
      - "${N8N_PORT:-5678}:5678"
    
    # User and system configuration
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_DATABASE_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console
      - N8N_METRICS=true
      - N8N_DIAGNOSTICS_ENABLED=true
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_SQLITE_POOL_SIZE=10
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    
    # Persistent storage for workflows and credentials
    volumes:
      - ${BUSINESS_CONFIG_PATH}/n8n:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro
    
    # Database dependency
    depends_on:
      - n8n-postgres
    
    # Update management
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ---------------------------------------------------------------------------
  # RECIPE MANAGEMENT
  # ---------------------------------------------------------------------------
  # PostgreSQL database for Mealie recipe management
  mealie-db:
    image: postgres:17
    container_name: mealie-db
    hostname: mealie-db
    restart: unless-stopped
    
    # Direct network access
    networks:
      business-network:
        ipv4_address: 172.42.0.4
    
    # Database configuration
    environment:
      - POSTGRES_DB=${MEALIE_DB_NAME:-mealie}
      - POSTGRES_USER=${MEALIE_DB_USER:-mealieuser}
      - POSTGRES_PASSWORD=${MEALIE_DB_PASSWORD:-mealiepass}
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    # Persistent storage for database
    volumes:
      - ${BUSINESS_CONFIG_PATH}/mealie-db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    
    # Fix permissions for PostgreSQL
    user: "999:999"
    
    # No health check - let PostgreSQL start naturally
    
    # Update management
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Mealie - Self-hosted recipe manager and meal planner
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    hostname: mealie
    restart: unless-stopped
    
    # Add startup delay to allow database initialization
    command: sh -c "sleep 30 && exec python -m mealie.api.main"
    
    # Direct network access
    networks:
      business-network:
        ipv4_address: 172.42.0.5
    
    # External access to web interface
    ports:
      - "${MEALIE_PORT:-9001}:9000"
    
    # User and system configuration
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MAX_WORKERS=1
      - WEB_CONCURRENCY=1
      - ALLOW_SIGNUP=${MEALIE_ALLOW_SIGNUP:-true}
      - BASE_URL=${MEALIE_BASE_URL:-http://localhost:9001}
      - DB_ENGINE=postgres
      - POSTGRES_USER=${MEALIE_DB_USER:-mealieuser}
      - POSTGRES_PASSWORD=${MEALIE_DB_PASSWORD:-mealiepass}
      - POSTGRES_SERVER=mealie-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${MEALIE_DB_NAME:-mealie}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Mealie}
      - SMTP_AUTH_STRATEGY=${SMTP_AUTH_STRATEGY:-TLS}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    
    # Persistent storage
    volumes:
      - ${BUSINESS_CONFIG_PATH}/mealie:/app/data
      - /etc/localtime:/etc/localtime:ro
    
    # Health check
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    
    # Database dependency
    depends_on:
      - mealie-db
    
    # Update management
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Note: Automatic updates handled by watchtower-infrastructure in INFRASTRUCTURE stack

# =============================================================================
# INTEGRATION NOTES
# =============================================================================
#
# BUSINESS STACK INTEGRATION:
# • n8n automates business workflows and productivity tasks
# • Mealie manages recipes and meal planning
# • Both services use PostgreSQL databases for data persistence
# • Can integrate with other stacks via webhooks and APIs
#
# NETWORK COMMUNICATION:
# • Business services: 172.42.0.0/24 network
# • Servarr services: 172.39.0.0/24 network
# • Streamarr services: 172.40.0.0/24 network
# • Creatarr services: 172.41.0.0/24 network
# • Infrastructure services: 172.43.0.0/24 network
# • Inter-stack communication via host networking
# • No direct container-to-container networking between stacks
#
# DATA FLOW:
# 1. n8n: Workflow automation can trigger actions across all stacks
# 2. Mealie: Recipe management for family meal planning
# 3. Both services: Independent operation with their own databases
# 4. Integration: Can be accessed via web interfaces and APIs
#
# =============================================================================
# END OF BUSINESS STACK CONFIGURATION
# =============================================================================

