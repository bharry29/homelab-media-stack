# =============================================================================
# CREATARR STACK - Creative Content & Family Life Management
# =============================================================================

networks:
  creatarr-network:
    name: creatarr-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.41.0.0/24

services:
  n8n-postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    hostname: n8n-postgres
    restart: unless-stopped
    networks:
      creatarr-network:
        ipv4_address: 172.41.0.10
    environment:
      - POSTGRES_DB=${N8N_DB_NAME}
      - POSTGRES_USER=${N8N_DB_USER}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${CREATARR_CONFIG_PATH}/n8n-postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n
    restart: unless-stopped
    networks:
      creatarr-network:
        ipv4_address: 172.41.0.11
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_DATABASE_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL}
      - N8N_LOG_OUTPUT=console
      - N8N_METRICS=true
      - N8N_DIAGNOSTICS_ENABLED=true
      - N8N_PROXY_HOPS=2
      - N8N_PUSH_BACKEND=websocket
      - VUE_APP_URL_BASE_API=${N8N_EDITOR_BASE_URL}
    volumes:
      - ${CREATARR_CONFIG_PATH}/n8n:/home/node/.n8n
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - n8n-postgres
    labels:
      - "com.centurylinklabs.watchtower.enable=true"